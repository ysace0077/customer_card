<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#3498db">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="상담카드관리">
    <title>고객 상담 카드 관리 시스템</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>고객 상담 카드 관리</h1>
            <div class="nav-buttons">
                <button id="uploadBtn" class="btn btn-primary">
                    <span class="btn-icon">📤</span>
                    <span class="btn-text">업로드</span>
                </button>
                <button id="searchBtn" class="btn btn-secondary">
                    <span class="btn-icon">🔍</span>
                    <span class="btn-text">검색</span>
                </button>
                <button id="syncBtn" class="btn btn-secondary">
                    <span class="btn-icon">🔄</span>
                    <span class="btn-text">동기화</span>
                </button>
                <button id="settingsBtn" class="btn btn-secondary">
                    <span class="btn-icon">⚙️</span>
                    <span class="btn-text">설정</span>
                </button>
            </div>
        </header>

        <!-- 업로드 섹션 -->
        <section id="uploadSection" class="section">
            <h2>상담 카드 업로드</h2>
            <form id="uploadForm" class="upload-form">
                <div class="form-group">
                    <label for="salesperson">판매자명:</label>
                    <select id="salesperson" name="salesperson" required>
                        <option value="">판매자를 선택하세요</option>
                        <option value="이호만 점장">이호만 점장</option>
                        <option value="김승진 실장">김승진 실장</option>
                        <option value="오희정 실장">오희정 실장</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="customerName">고객명:</label>
                    <input type="text" id="customerName" name="customerName" required>
                </div>
                
                <div class="form-group">
                    <label for="consultationDate">상담 날짜:</label>
                    <input type="date" id="consultationDate" name="consultationDate" required>
                </div>
                
                <div class="form-group">
                    <label for="cardImage">상담 카드 이미지 (JPG):</label>
                    <div class="file-input-container">
                        <input type="file" id="cardImage" name="cardImage" accept=".jpg,.jpeg,image/jpeg" capture="environment" required>
                        <div class="file-input-buttons">
                            <button type="button" id="cameraBtn" class="btn btn-secondary file-btn">
                                <span class="btn-icon">📷</span>
                                <span class="btn-text">카메라</span>
                            </button>
                            <button type="button" id="galleryBtn" class="btn btn-secondary file-btn">
                                <span class="btn-icon">🖼️</span>
                                <span class="btn-text">갤러리</span>
                            </button>
                            <button type="button" id="scanBtn" class="btn btn-secondary file-btn">
                                <span class="btn-icon">📄</span>
                                <span class="btn-text">문서스캔</span>
                            </button>
                        </div>
                    </div>
                    <div class="file-info">
                        JPG 파일만 업로드 가능합니다. 
                        <span class="mobile-hint">📱 모바일: 카메라/문서스캔 사용 가능</span>
                    </div>
                    <div id="imagePreview" class="image-preview hidden">
                        <img id="previewImg" src="" alt="미리보기">
                        <div class="preview-actions">
                            <button type="button" id="retakeBtn" class="btn btn-secondary">📷 다시 촬영</button>
                            <button type="button" id="enhanceBtn" class="btn btn-primary">✨ 이미지 개선</button>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="notes">메모 (선택사항):</label>
                    <textarea id="notes" name="notes" rows="3" placeholder="상담 내용 요약이나 특이사항을 입력하세요"></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary btn-large">📤 업로드 하기</button>
            </form>
        </section>

        <!-- 검색 섹션 -->
        <section id="searchSection" class="section hidden">
            <h2>상담 카드 검색</h2>
            <div class="search-form">
                <div class="search-group">
                    <div class="input-with-icon">
                        <span class="input-icon">👤</span>
                        <input type="text" id="searchCustomer" placeholder="고객명으로 검색" autocomplete="off">
                    </div>
                    <button id="searchExecute" class="btn btn-primary">🔍 검색</button>
                </div>
                
                <div class="filter-section">
                    <h3 class="filter-title">🔽 상세 필터</h3>
                    
                    <div class="filter-content">
                        <!-- 판매자 필터 -->
                        <div class="filter-row">
                            <div class="quick-filters">
                                <h4 class="quick-filter-title">👨‍💼 판매자</h4>
                                <div class="salesperson-filter-buttons">
                                    <button class="salesperson-filter-btn active" data-salesperson="">전체</button>
                                    <button class="salesperson-filter-btn" data-salesperson="이호만 점장">이호만 점장</button>
                                    <button class="salesperson-filter-btn" data-salesperson="김승진 실장">김승진 실장</button>
                                    <button class="salesperson-filter-btn" data-salesperson="오희정 실장">오희정 실장</button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 기간 설정 -->
                        <div class="filter-row">
                            <div class="quick-filters">
                                <h4 class="quick-filter-title">📅 기간 설정</h4>
                                <div class="quick-filter-buttons">
                                    <button class="quick-filter-btn active" data-period="all">전체</button>
                                    <button class="quick-filter-btn" data-period="week">금주</button>
                                    <button class="quick-filter-btn" data-period="month">당월</button>
                                    <button class="quick-filter-btn" data-period="lastMonth">지난 달</button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 필터 액션 버튼 -->
                        <div class="filter-row">
                            <div class="filter-actions">
                                <button id="filterBtn" class="btn btn-primary btn-filter">✓ 필터 적용</button>
                                <button id="resetFilterBtn" class="btn btn-secondary btn-filter">↺ 초기화</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="searchResults" class="search-results"></div>
        </section>
    </div>

    <!-- 이미지 모달 -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modalImage" src="" alt="상담 카드">
            <div id="modalInfo" class="modal-info"></div>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>GitHub 저장소 설정</h2>
            <div class="settings-form">
                <div class="form-group">
                    <label for="githubOwner">GitHub 사용자명/조직명:</label>
                    <input type="text" id="githubOwner" placeholder="예: myusername">
                </div>
                <div class="form-group">
                    <label for="githubRepo">저장소명:</label>
                    <input type="text" id="githubRepo" placeholder="예: consultation-cards">
                </div>
                <div class="form-group">
                    <label for="githubToken">Personal Access Token:</label>
                    <input type="password" id="githubToken" placeholder="ghp_...">
                    <div class="file-info">
                        <a href="https://github.com/settings/tokens" target="_blank">
                            GitHub에서 토큰 생성하기
                        </a> (Contents 권한 필요)
                    </div>
                </div>
                <div class="form-group">
                    <label for="githubBranch">브랜치명:</label>
                    <input type="text" id="githubBranch" value="main">
                </div>
                <div class="settings-actions">
                    <button id="saveSettingsBtn" class="btn btn-primary">💾 설정 저장</button>
                    <button id="testConnectionBtn" class="btn btn-secondary">🔗 연결 테스트</button>
                    <button id="cleanupStorageBtn" class="btn btn-secondary">🧹 저장소 정리</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

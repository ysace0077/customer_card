<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#3498db">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="상담카드관리">
    <title>고객 상담 카드 관리 시스템</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>고객 상담 카드 관리 시스템</h1>
            <div class="nav-buttons">
                <button id="uploadBtn" class="btn btn-primary">📤 업로드</button>
                <button id="searchBtn" class="btn btn-secondary">🔍 검색</button>
                <button id="githubConfigBtn" class="btn btn-secondary">⚙️ GitHub 설정</button>
            </div>
        </header>

        <!-- 업로드 섹션 -->
        <section id="uploadSection" class="section">
            <h2>상담 카드 업로드</h2>
            <form id="uploadForm" class="upload-form">
                <div class="form-group">
                    <label for="salesperson">판매자명:</label>
                    <input type="text" id="salesperson" name="salesperson" required>
                </div>
                
                <div class="form-group">
                    <label for="customerName">고객명:</label>
                    <input type="text" id="customerName" name="customerName" required>
                </div>
                
                <div class="form-group">
                    <label for="consultationDate">상담 날짜:</label>
                    <input type="date" id="consultationDate" name="consultationDate" required>
                </div>
                
                <div class="form-group">
                    <label for="cardImage">상담 카드 이미지 (JPG):</label>
                    <input type="file" id="cardImage" name="cardImage" accept=".jpg,.jpeg,image/jpeg" capture="environment" required>
                    <div class="file-info">JPG 파일만 업로드 가능합니다. 카메라로 직접 촬영도 가능합니다.</div>
                </div>
                
                <div class="form-group">
                    <label for="notes">메모 (선택사항):</label>
                    <textarea id="notes" name="notes" rows="3" placeholder="상담 내용 요약이나 특이사항을 입력하세요"></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary">📤 업로드 하기</button>
            </form>
        </section>

        <!-- 검색 섹션 -->
        <section id="searchSection" class="section hidden">
            <h2>상담 카드 검색</h2>
            <div class="search-form">
                <div class="search-group">
                    <input type="text" id="searchCustomer" placeholder="고객명으로 검색" autocomplete="off">
                    <button id="searchExecute" class="btn btn-primary">🔍 검색</button>
                </div>
                
                <div class="filter-group">
                    <select id="salespersonFilter">
                        <option value="">모든 판매자</option>
                    </select>
                    <input type="date" id="dateFrom" placeholder="시작 날짜">
                    <input type="date" id="dateTo" placeholder="종료 날짜">
                    <button id="filterBtn" class="btn btn-secondary">📅 필터 적용</button>
                </div>
            </div>
            
            <div id="searchResults" class="search-results"></div>
        </section>
    </div>

    <!-- 이미지 모달 -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modalImage" src="" alt="상담 카드">
            <div id="modalInfo" class="modal-info"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
